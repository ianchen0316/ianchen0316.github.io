name: Maintain AI ML Knowledge Graph
on:
  workflow_dispatch:
  schedule:
    # 09:30 Taiwan time (UTC+8). GitHub schedules can be delayed.
    - cron: '30 1 * * *'
permissions:
  contents: write
concurrency:
  group: ai-ml-knowledge-maintenance
  cancel-in-progress: false
jobs:
  update-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline tests
        run: python3 -m unittest discover -s knowledge-graph -p 'test_*.py' -v
      - name: Inspect Notion and prepare private change digest
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_REVIEW_TOKEN: ${{ secrets.NOTION_REVIEW_TOKEN }}
          NOTION_REVIEW_DATA_SOURCE_ID: ${{ vars.NOTION_REVIEW_DATA_SOURCE_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
          SEMANTIC_MAX_PAGES_PER_RUN: ${{ vars.SEMANTIC_MAX_PAGES_PER_RUN || '5' }}
          SEMANTIC_BACKFILL_BASELINE: ${{ vars.SEMANTIC_BACKFILL_BASELINE || 'false' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
          REPORT_EMAIL_FROM: ${{ vars.REPORT_EMAIL_FROM }}
        run: |
          if [ -z "$NOTION_TOKEN" ]; then
            echo "NOTION_TOKEN not configured; skipping sync." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 knowledge-graph/maintain.py
          python3 knowledge-graph/refresh_curated.py
      - name: Publish Notion-approved concepts and relationships
        id: review
        env:
          NOTION_REVIEW_TOKEN: ${{ secrets.NOTION_REVIEW_TOKEN }}
          NOTION_REVIEW_DATA_SOURCE_ID: ${{ vars.NOTION_REVIEW_DATA_SOURCE_ID }}
        run: |
          if [ -n "$NOTION_REVIEW_TOKEN" ] && [ -n "$NOTION_REVIEW_DATA_SOURCE_ID" ]; then
            python3 knowledge-graph/review_queue.py
          else
            echo "Private review queue not configured; skipping approved publication." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Commit approved public metadata and redacted fingerprints
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knowledge-graph/index.html knowledge-graph/state/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh curated graph source metadata"
            git push
          fi
      - name: Mark committed queue items as Published
        if: ${{ steps.review.outputs.applied != '' }}
        env:
          NOTION_REVIEW_TOKEN: ${{ secrets.NOTION_REVIEW_TOKEN }}
          NOTION_REVIEW_DATA_SOURCE_ID: ${{ vars.NOTION_REVIEW_DATA_SOURCE_ID }}
          APPLIED_REVIEW_IDS: ${{ steps.review.outputs.applied }}
        run: python3 knowledge-graph/finalize_published.py
