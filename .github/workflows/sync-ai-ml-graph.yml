name: Sync AI ML Knowledge Graph from Notion
on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * *'
permissions:
  contents: write
jobs:
  update-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh from approved Notion roots (read-only)
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          if [ -z "$NOTION_TOKEN" ]; then
            echo "NOTION_TOKEN secret is not configured; leaving published graph unchanged."
            exit 0
          fi
          python3 knowledge-graph/sync_notion.py
      - name: Commit refreshed site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knowledge-graph/index.html
          git diff --cached --quiet || (git commit -m "chore: sync AI ML graph from Notion" && git push)
